<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abu Sufian</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Hind Siliguri',sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    overflow:hidden;

    background:
    radial-gradient(
        circle at 10% 15%,
        rgba(34,197,94,.28),
        transparent 28%
    ),

    radial-gradient(
        circle at 90% 85%,
        rgba(250,204,21,.18),
        transparent 25%
    ),

    linear-gradient(
        135deg,
        #021f17,
        #064e3b,
        #022c22
    );
}


/* =========================
   BACKGROUND GLOW
========================= */

.glow{
    position:fixed;

    border-radius:50%;

    pointer-events:none;

    filter:blur(2px);

    opacity:.45;

    animation:floatGlow 7s ease-in-out infinite;
}

.glow1{
    width:120px;
    height:120px;

    background:#22c55e;

    top:5%;
    left:5%;
}

.glow2{
    width:170px;
    height:170px;

    background:#facc15;

    bottom:-50px;
    right:-30px;

    animation-delay:2s;
}

.glow3{
    width:70px;
    height:70px;

    background:#16a34a;

    top:45%;
    right:8%;

    animation-delay:4s;
}

@keyframes floatGlow{

    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-30px) scale(1.08);
    }
}


/* =========================
   PARTICLES
========================= */

.particle{

    position:fixed;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#86efac;

    box-shadow:
    0 0 15px #22c55e;

    opacity:.7;

    animation:particleUp 8s linear infinite;
}

.p1{
    left:10%;
    bottom:-20px;
}

.p2{
    left:30%;
    bottom:-20px;
    animation-delay:2s;
}

.p3{
    left:55%;
    bottom:-20px;
    animation-delay:4s;
}

.p4{
    left:80%;
    bottom:-20px;
    animation-delay:1s;
}

.p5{
    left:93%;
    bottom:-20px;
    animation-delay:5s;
}

@keyframes particleUp{

    0%{
        transform:translateY(0) scale(.4);
        opacity:0;
    }

    20%{
        opacity:.8;
    }

    80%{
        opacity:.7;
    }

    100%{
        transform:translateY(-110vh) scale(1.5);
        opacity:0;
    }
}


/* =========================
   MAIN CARD
========================= */

.container{

    position:relative;

    width:100%;
    max-width:430px;

    padding:38px 28px 32px;

    text-align:center;

    border-radius:30px;

    background:
    rgba(255,255,255,.10);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid
    rgba(255,255,255,.20);

    box-shadow:

    0 30px 80px
    rgba(0,0,0,.45),

    inset 0 0 30px
    rgba(255,255,255,.04);

    animation:
    cardShow 1.1s
    cubic-bezier(.17,.67,.3,1.3)
    forwards;
}

@keyframes cardShow{

    0%{
        opacity:0;

        transform:
        translateY(80px)
        scale(.75)
        rotateX(15deg);
    }

    100%{
        opacity:1;

        transform:
        translateY(0)
        scale(1)
        rotateX(0);
    }
}


/* =========================
   TOP ANIMATED LINE
========================= */

.container::before{

    content:"";

    position:absolute;

    top:-2px;
    left:10%;

    width:80%;
    height:3px;

    border-radius:10px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #22c55e,
        #facc15,
        #22c55e,
        transparent
    );

    box-shadow:
    0 0 15px #22c55e;

    animation:
    lineGlow 2.5s ease-in-out infinite;
}

@keyframes lineGlow{

    0%,100%{
        opacity:.35;
        transform:scaleX(.6);
    }

    50%{
        opacity:1;
        transform:scaleX(1);
    }
}


/* =========================
   PHOTO
========================= */

.photo-area{

    position:relative;

    width:190px;
    height:190px;

    margin:0 auto 25px;

    display:flex;

    justify-content:center;

    align-items:center;
}


/* Rotating border */

.photo-area::before{

    content:"";

    position:absolute;

    width:190px;
    height:190px;

    border-radius:18px;

    border:4px solid transparent;

    border-top-color:#22c55e;
    border-right-color:#facc15;
    border-bottom-color:#16a34a;
    border-left-color:#fde047;

    animation:
    rotateBorder 4s linear infinite;

    filter:
    drop-shadow(0 0 10px #22c55e);
}

@keyframes rotateBorder{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


/* Inner glow */

.photo-area::after{

    content:"";

    position:absolute;

    width:172px;
    height:172px;

    border-radius:15px;

    border:1px solid
    rgba(255,255,255,.5);

    box-shadow:
    0 0 25px
    rgba(34,197,94,.5);

    animation:
    photoGlow 2s ease-in-out infinite;
}

@keyframes photoGlow{

    0%,100%{
        transform:scale(.96);
        opacity:.5;
    }

    50%{
        transform:scale(1.04);
        opacity:1;
    }
}


/* =========================
   PROFILE IMAGE
========================= */

.profile-img{

    position:relative;

    z-index:5;

    width:160px;
    height:160px;

    object-fit:cover;

    border-radius:10px;

    border:5px solid white;

    box-shadow:

    0 15px 40px
    rgba(0,0,0,.45),

    0 0 25px
    rgba(34,197,94,.5);

    animation:
    imageFloat 3s ease-in-out infinite alternate;

    transition:.4s;
}

@keyframes imageFloat{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.025);
    }
}

.profile-img:hover{

    transform:
    scale(1.07)
    rotate(2deg);

    box-shadow:

    0 20px 50px
    rgba(0,0,0,.5),

    0 0 40px
    rgba(34,197,94,.8);
}


/* =========================
   NAME
========================= */

h1{

    color:#ffffff;

    font-size:2.2rem;

    font-weight:700;

    margin-bottom:5px;

    text-shadow:
    0 0 18px
    rgba(34,197,94,.5);

    animation:
    nameAnimation 1s ease-out .6s both;
}

@keyframes nameAnimation{

    from{
        opacity:0;

        transform:
        translateY(25px);

        filter:blur(8px);
    }

    to{
        opacity:1;

        transform:
        translateY(0);

        filter:blur(0);
    }
}


/* =========================
   TITLE
========================= */

.title{

    color:#86efac;

    font-size:1.05rem;

    font-weight:600;

    margin-bottom:18px;

    animation:
    titleAnimation 1s ease-out .9s both;
}

@keyframes titleAnimation{

    from{
        opacity:0;
        letter-spacing:8px;
    }

    to{
        opacity:1;
        letter-spacing:1px;
    }
}


/* =========================
   ONLINE STATUS
========================= */

.status{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    color:#bbf7d0;

    font-size:.9rem;

    margin-bottom:25px;

    animation:
    fadeIn 1s ease 1.2s both;
}

.status-dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
    0 0 10px #22c55e;

    animation:
    onlinePulse 1.5s infinite;
}

@keyframes onlinePulse{

    0%{
        box-shadow:
        0 0 0 0
        rgba(34,197,94,.8);
    }

    70%{
        box-shadow:
        0 0 0 10px
        rgba(34,197,94,0);
    }

    100%{
        box-shadow:
        0 0 0 0
        rgba(34,197,94,0);
    }
}


/* =========================
   CHAT BUTTON
========================= */

.chat-btn{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    width:100%;

    padding:17px 20px;

    border-radius:16px;

    border:1px solid
    rgba(255,255,255,.25);

    color:#ffffff;

    text-decoration:none;

    font-size:1.15rem;

    font-weight:700;

    cursor:pointer;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a,
        #15803d
    );

    box-shadow:

    0 12px 30px
    rgba(34,197,94,.35);

    animation:
    buttonShow 1s ease-out 1.5s both;

    transition:.35s;
}

@keyframes buttonShow{

    from{
        opacity:0;

        transform:
        translateY(30px)
        scale(.85);
    }

    to{
        opacity:1;

        transform:
        translateY(0)
        scale(1);
    }
}


/* Shine */

.chat-btn::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:70%;

    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
    );

    transform:skewX(-25deg);

    animation:
    buttonShine 3s infinite;
}

@keyframes buttonShine{

    0%{
        left:-120%;
    }

    45%,100%{
        left:140%;
    }
}


/* Button pulse */

.chat-btn::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:16px;

    border:2px solid
    rgba(134,239,172,.35);

    animation:
    buttonBorder 2s infinite;
}

@keyframes buttonBorder{

    0%,100%{
        opacity:.3;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.03);
    }
}

.chat-btn:hover{

    transform:
    translateY(-5px)
    scale(1.02);

    box-shadow:

    0 20px 45px
    rgba(34,197,94,.55);
}

.chat-btn:active{

    transform:
    scale(.96);
}


/* Icon */

.chat-btn i{

    font-size:1.3rem;

    animation:
    chatIcon 1.5s ease-in-out infinite;
}

@keyframes chatIcon{

    0%,100%{
        transform:rotate(0);
    }

    25%{
        transform:rotate(-12deg);
    }

    75%{
        transform:rotate(12deg);
    }
}


/* =========================
   BOTTOM TEXT
========================= */

.bottom-text{

    margin-top:18px;

    color:
    rgba(255,255,255,.55);

    font-size:.82rem;

    animation:
    fadeIn 1s ease 1.8s both;
}

@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{
        padding:15px;
    }

    .container{

        max-width:390px;

        padding:
        32px 22px;

        border-radius:26px;
    }

    .photo-area{

        width:170px;
        height:170px;
    }

    .photo-area::before{

        width:170px;
        height:170px;
    }

    .photo-area::after{

        width:154px;
        height:154px;
    }

    .profile-img{

        width:145px;
        height:145px;
    }

    h1{
        font-size:1.9rem;
    }

    .title{
        font-size:1rem;
    }

}


/* =========================
   REDUCE MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;
    }
}

</style>

</head>


<body>


<!-- Background -->

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>


<!-- MAIN CARD -->

<div class="container">


    <!-- PROFILE PHOTO -->

    <div class="photo-area">

        <!-- এখানে আপনার ছবি দিন -->

        <img
        src="https://raw.githubusercontent.com/a01868293471-collab/ALIF-SMM-PANEL-/refs/heads/main/FB_IMG_1786643978925.jpg"
        alt="Abu Sufian"
        class="profile-img">

    </div>


    <!-- NAME -->

    <h1>Abu Sufian</h1>


    <!-- TITLE -->

    <div class="title">
      
    </div>


    <!-- ONLINE -->

    <div class="status">

        <span class="status-dot"></span>

        Active Now

    </div>


    <!-- CHAT BUTTON -->

    <a
        href="javascript:void(0)"
        onclick="openChat()"
        class="chat-btn">

        <span>Message</span>

        <i class="fa-solid fa-comment-dots"></i>

    </a>


    <!-- TEXT -->

    <div class="bottom-text">

      

    </div>


</div>
